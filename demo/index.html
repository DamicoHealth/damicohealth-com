<!--
  KERNEL FIRST, REACT SECOND.

  These four files are the hardened data/sync kernel, vendored byte-for-byte
  from packages/pwa (see scripts/sync-kernel.mjs). They are classic scripts that
  populate window.platform / window.platformRecords / window.pwaSync /
  window.idbStore, and they carry every durability invariant protecting real
  patient records. They must load, in this order, BEFORE the React bundle.
-->
<!--
  STORAGE NAMESPACE, set before ANY kernel script reads it.

  IndexedDB and localStorage are scoped to the ORIGIN, not the path. This
  preview is served from the same GitHub Pages origin as the production app at
  /pwa/, so without a suffix it would read and write the REAL patient database.
  Vite replaces the placeholder; it is empty in dev and '-react' for the
  deployed preview. When this build becomes production, the suffix goes back to
  empty AND an explicit migration is needed for anything entered under it.
-->
<script>window.DH_STORAGE_SUFFIX = "-demo"; window.DH_DEMO = true;</script>
<script src="/demo/kernel/kernel-globals.js"></script>
<script src="/demo/kernel/native-storage.js"></script>
<script src="/demo/kernel/idb-storage.js"></script>
<script src="/demo/kernel/pwa-sync.js"></script>
<script src="/demo/kernel/platform.js"></script>
